<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>London Travel Chatbot 🌍</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.3/dist/leaflet.css" />
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: #f2f2f2;
      color: #333;
    }
    header {
      background: linear-gradient(to right, #283e51, #485563);
      color: white;
      padding: 60px 20px;
      text-align: center;
      background-image: url('https://images.unsplash.com/photo-1533929736458-ca588d08c8be?ixlib=rb-1.2.1&auto=format&fit=crop&w=1500&q=80');
      background-size: cover;
      background-position: center;
      position: relative;
    }
    header::after {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 0;
    }
    header h1, header p { position: relative; z-index: 1; }
    h1 { font-size: 3rem; margin: 0; }
    p.subtitle { font-size: 1.2rem; font-weight: 300; margin-top: 10px; }
    .container { max-width: 960px; margin: auto; padding: 2rem; }
    .example-questions { display: flex; flex-wrap: wrap; gap: 10px; margin: 1rem 0; }
    .btn-example {
      background-color: #1d3557;
      color: white;
      border: none;
      border-radius: 30px;
      padding: 10px 20px;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .btn-example:hover { background-color: #457b9d; }
    .weather-widget {
      background-color: #fff3cd;
      padding: 1rem;
      border-left: 5px solid #ffc107;
      margin-top: 20px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .weather-widget h3 { margin: 0 0 5px 0; }
    .btn-weather {
      background-color: #ffc107;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }
    .btn-weather:hover { background-color: #e0a800; }
    .heatmap-section, .map-section {
      margin-top: 2rem;
      padding: 1rem;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }
    #mapid { height: 400px; width: 100%; border-radius: 10px; margin-top: 1rem; }
    footer {
      text-align: center;
      background-color: #1d3557;
      color: white;
      padding: 1rem;
      margin-top: 2rem;
    }
    df-messenger {
      --df-messenger-bot-message: #e3f2fd;
      --df-messenger-button-titlebar-color: #1d3557;
      --df-messenger-chat-background-color: #fafafa;
      --df-messenger-font-color: #333;
      --df-messenger-user-message: #1d3557;
      --df-messenger-send-icon: #ffc107;
    }
  </style>
  <script src="https://www.gstatic.com/dialogflow-console/fast/messenger/bootstrap.js?v=1"></script>
</head>
<body>
  <header>
    <h1>🌆 London Travel Chatbot</h1>
    <p class="subtitle">Your AI Assistant for Exploring London with Style</p>
  </header>
  <div class="container">
    <h2>👋 Try Asking Me:</h2>
    <div class="example-questions">
      <button class="btn-example" onclick="askExample('What can I do near Tower Bridge for free?')">Tower Bridge Ideas</button>
      <button class="btn-example" onclick="askExample('How do I get around London?')">Transportation Help</button>
      <button class="btn-example" onclick="askExample('What\'s the weather like in London today?')">Check Weather</button>
      <button class="btn-example" onclick="askExample('Convert 100 dollars to pounds')">Currency Converter</button>
      <button class="btn-example" onclick="askExample('Suggest some Italian restaurants in Camden')">Food in Camden</button>
    </div>
    <div class="weather-widget">
      <div>
        <h3>🌦️ Need the Latest London Weather?</h3>
        <p>Click the button for a real-time update!</p>
      </div>
      <button class="btn-weather" onclick="getWeather()">Get Weather</button>
    </div>
    <div class="heatmap-section">
      <h2>📊 Visitor Interest Over Time</h2>
      <canvas id="visitorChart" height="100"></canvas>
    </div>
    <div class="map-section">
      <h2>🗺️ Popular Tourist Spots in London</h2>
      <div id="mapid"></div>
    </div>
  </div>
  <df-messenger
    chat-icon="https://drive.google.com/uc?export=view&id=1VsoSncOJ78o9WZ9maLqN0MwDVpA9NNgO"
    chat-title="London_Tourism_chatbot"
    agent-id="19787e79-c4bb-4fd5-bdff-85dedd2de68d"
    language-code="en"
  ></df-messenger>
  <footer>
    <p>© 2025 London Travel Guide | Designed by Mittens 🎓</p>
  </footer>
  <script>
    function askExample(question) {
      const dfMessenger = document.querySelector("df-messenger");
      setTimeout(() => {
        try {
          const messenger = dfMessenger.shadowRoot.querySelector("df-messenger-chat");
          const userInput = messenger.shadowRoot.querySelector("df-messenger-user-input");
          const input = userInput.shadowRoot.querySelector("input");
          input.value = question;
          input.dispatchEvent(new Event("input", { bubbles: true }));
          const sendButton = userInput.shadowRoot.querySelector("button");
          sendButton.click();
        } catch (err) {
          console.error("❌ Couldn't send message:", err);
        }
      }, 1000);
    }
    async function getWeather() {
      const API_KEY = "c6a1a88292591e7ab44a1f43d43a3774";
      const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=London,uk&units=metric&appid=${API_KEY}`);
      const data = await response.json();
      const temp = Math.round(data.main.temp);
      const desc = data.weather[0].description;
      const feels = Math.round(data.main.feels_like);
      const humidity = data.main.humidity;
      const wind = data.wind.speed;
      Swal.fire({
        title: '🌤️ London Weather',
        html: `<b>Condition:</b> ${desc}<br><b>Temperature:</b> ${temp}°C (feels like ${feels}°C)<br><b>Humidity:</b> ${humidity}%<br><b>Wind Speed:</b> ${wind} m/s`,
        icon: 'info',
        confirmButtonText: 'Nice!'
      });
    }
    const ctx = document.getElementById('visitorChart').getContext('2d');
    const visitorChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
        datasets: [{
          label: 'Tourist Queries (Sample)',
          data: [12, 19, 8, 15, 22, 30, 27],
          fill: true,
          borderColor: '#1d3557',
          backgroundColor: 'rgba(29, 53, 87, 0.2)',
          tension: 0.4
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { position: 'top' },
          title: { display: true, text: 'Live Interaction Trends' }
        }
      }
    });
    // Render a Leaflet map with popular locations
    const map = L.map('mapid').setView([51.5074, -0.1278], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    const places = [
      { name: 'Tower Bridge', lat: 51.5055, lng: -0.0754 },
      { name: 'Big Ben', lat: 51.5007, lng: -0.1246 },
      { name: 'London Eye', lat: 51.5033, lng: -0.1195 },
      { name: 'Buckingham Palace', lat: 51.5014, lng: -0.1419 },
      { name: 'Camden Market', lat: 51.5416, lng: -0.1422 }
    ];
    places.forEach(place => {
      L.marker([place.lat, place.lng]).addTo(map).bindPopup(`<b>${place.name}</b>`);
    });
  </script>
</body>
</html>
